# Demo profile (SOLUTION.md section 14.1). Docker Compose only -- no Kubernetes.
#
#   docker compose up -d
#
# Migrations in ./migrations are applied in filename order on first boot of an
# empty volume. To re-apply from scratch: docker compose down -v && up -d.
services:
  db:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: pravaah
      POSTGRES_PASSWORD: pravaah
      POSTGRES_DB: pravaah
    # Host 15432, not 5432: an unrelated postgres:16 container already owns
    # 5432 on this machine. Docker silently declines to publish a taken port,
    # which looks identical to a working stack until a client connects and
    # reaches the other server. Override the DSN with PRAVAAH_DATABASE_DSN.
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/home/postgres/pgdata/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pravaah -d pravaah"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
